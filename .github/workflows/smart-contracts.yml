name: Smart Contract Tests

on:
  push:
    paths:
      - "Smart_contracts/**"
      - ".github/workflows/smart-contracts.yml"
  pull_request:
    paths:
      - "Smart_contracts/**"
      - ".github/workflows/smart-contracts.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smart_contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Smart_contracts/package.json

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Start Ganache
        run: |
          npx ganache --server.host 127.0.0.1 --server.port 8545 --chain.chainId 31337 --chain.networkId 31337 --wallet.totalAccounts 10 > /tmp/ganache.log 2>&1 &
          sleep 5

      - name: Run tests
        run: npm test -- --network development
