name: Smart Contract Tests

on:
  push:
    paths:
      - "Smart_contracts/**"
  pull_request:
    paths:
      - "Smart_contracts/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Smart_contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Smart_contracts/package.json

      - name: Install dependencies
        run: npm install

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: npm test
